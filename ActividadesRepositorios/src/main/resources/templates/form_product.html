<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Producto</title>
</head>
<body>

    <h1 th:if="${producto.id != 0}">Edita el producto:</h1>
    <h1 th:unless="${producto.id != 0}">Añade un producto:</h1>

    <form th:action="@{/producto/updateOrSaveProduct}" th:object="${producto}" method="post">
        
        <input type="hidden" th:field="*{id}" />

        <p>
            <label>Nombre del producto:</label><br>
            <input type="text" th:field="*{nombre}" required />
        </p>
        
        <p>
            <label>Precio del producto:</label><br>
            <input type="number" step="0.01" th:field="*{precio}" required />
        </p>
        
        <p>
            <label>Stock del producto:</label><br>
            <input type="number" th:field="*{stock}" required />
        </p>
        
        <p>
    		<label>Categoría del producto:</label><br>
    		<select th:field="*{categoria.id}" required>
        		<option value="">Selecciona una categoría</option>
        		<option 
        			th:each="cat : ${categorias}" 
                	th:value="${cat.id}" 
                	th:text="${cat.nombre}">
        		</option>
    		</select>
</p>

        <p>
            <input type="submit" th:if="${producto.id == 0}" value="Añadir" />
            <input type="submit" th:unless="${producto.id == 0}" value="Guardar" />
        </p>

    </form>

</body>
</html>
